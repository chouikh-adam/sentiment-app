[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-app"
version = "0.6.0"
description = "Analyse de sentiment d'avis clients"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn==1.5.2",
    "pandas",
    "joblib",
    "fastapi",
    "uvicorn",
    "streamlit",
    "httpx",
    "pydantic",
]

[project.scripts]
sentiment = "sentiment_app.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentiment_app*", "api*", "ui*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["joblib", "joblib.*", "sklearn", "sklearn.*", "pandas", "pandas.*", "uvicorn", "uvicorn.*", "httpx", "httpx.*", "streamlit", "streamlit.*"]
ignore_missing_imports = true

[tool.coverage.report]
show_missing = true
skip_empty = true
